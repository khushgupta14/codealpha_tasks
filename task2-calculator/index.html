<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="keypad">
            <button id="clear" class="btn clear">C</button>
            <button class="btn operator" data-action="/">/</button>
            <button class="btn operator" data-action="*">x</button>
            
            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operator" data-action="-">-</button>
            
            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn operator" data-action="+">+</button>
            
            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>
            <button id="equals" class="btn equals">=</button>
            
            <button class="btn number zero">0</button>
            <button class="btn number">.</button>
        </div>
    </div>
    <script src="script.js"></script>
    <footer class="footer">
        Created by <strong>Khush Gupta</strong>
    </footer>
</body>
</html>
